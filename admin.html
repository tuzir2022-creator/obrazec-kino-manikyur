<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Лепесток - панель мастера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-paper: #F5EFF3; --color-surface: #FFFFFF; --color-ink: #2A1730; --color-muted: #6B5A70; --color-line: #E3D3DD;
  --color-accent: #A4236E; --color-accent-soft: #F0D9E8; --color-focus: #1D4ED8; --color-err: #8A2412;
  --font-display: "Comfortaa", "Trebuchet MS", system-ui, sans-serif; --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --radius-m: 20px;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 1rem/1.5 var(--font-body); padding: env(safe-area-inset-top) max(var(--space-md), env(safe-area-inset-right)) env(safe-area-inset-bottom) max(var(--space-md), env(safe-area-inset-left)); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
header, main { max-width: 1100px; margin: 0 auto; }
header { padding: var(--space-lg) 0 var(--space-md); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
h1 { margin: 0; font: 700 1.375rem/1.2 var(--font-display); }
.bar { display: flex; gap: var(--space-sm); align-items: center; flex-wrap: wrap; }
input[type="date"], input[type="password"] { min-height: 48px; padding: 0 var(--space-md); border-radius: 12px; border: 2px solid var(--color-line); background: var(--color-surface); }
.btn { min-height: 48px; padding: 0 var(--space-lg); border-radius: 999px; border: 2px solid var(--color-ink); background: transparent; font-weight: 700; white-space: nowrap; cursor: pointer; }
.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.btn-s { min-height: 40px; padding: 0 var(--space-md); font-size: .875rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: var(--space-md); padding-bottom: var(--space-lg); }
.col { background: var(--color-surface); border-radius: var(--radius-m); padding: var(--space-md); }
.col h2 { margin: 0 0 var(--space-md); font: 700 1.125rem/1.2 var(--font-display); color: var(--color-accent); }
.rec { padding: var(--space-md); border-radius: 14px; background: var(--color-paper); margin-bottom: var(--space-sm); display: grid; gap: 2px; }
.rec b { font: 700 1.125rem var(--font-display); }
.rec .sub { color: var(--color-muted); font-size: .9375rem; }
.rec a { color: var(--color-ink); font-weight: 600; }
.empty { color: var(--color-muted); margin: 0; }
.stamp { color: var(--color-muted); font-size: .875rem; }
#gate { max-width: 420px; margin: 20vh auto; display: grid; gap: var(--space-md); }
.err { color: var(--color-err); margin: 0; }
</style>
</head>
<body>
<form id="gate">
  <h1>Панель мастера</h1>
  <label for="key">Ключ доступа (выдаёт администратор демо)</label>
  <input id="key" type="password" autocomplete="off" required>
  <p class="err" id="gateErr" hidden></p>
  <button class="btn btn-primary" type="submit">Открыть</button>
</form>

<div id="app" hidden>
  <header>
    <h1>Лепесток: записи</h1>
    <div class="bar"><label class="stamp" for="date">День</label><input id="date" type="date"><button class="btn" id="out" type="button">Выйти</button></div>
  </header>
  <main><p class="stamp" id="stamp"></p><div class="cols" id="cols"></div></main>
</div>

<script>
"use strict";
const API = "https://zerno-lepestok-api.tuzir2022.workers.dev";
const log = { error: (m, e, c) => console.error(JSON.stringify({ ts: new Date().toISOString(), level: "error", scope: "lepestok-admin", msg: m, ...c, error: { name: e?.name, message: e?.message, stack: e?.stack } })) };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MASTERS = { anna: "Анна", maria: "Мария", elena: "Елена" };
let key = "", timer = null;
try { key = sessionStorage.getItem("lepestok.key") || ""; } catch {}

async function call(path, body) {
  const res = await fetch(API + path, { method: body ? "POST" : "GET", headers: { "X-Admin-Key": key, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || "http " + res.status); e.status = res.status; throw e; }
  return data;
}
const end = (t, min) => { const [h, m] = t.split(":").map(Number); const x = h * 60 + m + min; return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };
const fmtPhone = (p) => (p.length === 11 ? `+7 ${p.slice(1, 4)} ${p.slice(4, 7)}-${p.slice(7, 9)}-${p.slice(9)}` : p);

async function refresh() {
  clearTimeout(timer);
  const date = $("#date").value;
  try {
    const d = await call("/admin/nails?date=" + date);
    $("#cols").innerHTML = Object.entries(MASTERS).map(([id, name]) => {
      const list = d.bookings.filter((b) => b.master === id);
      return `<section class="col" aria-label="${name}"><h2>${name}</h2>${list.length ? list.map((b) => `
        <article class="rec"><b>${b.time}-${end(b.time, b.minutes)}</b><span>${esc(b.serviceName)}</span><span class="sub">${esc(b.name)}, <a href="tel:+${esc(b.phone)}">${fmtPhone(b.phone)}</a></span>
        <div><button class="btn btn-s" data-cancel="${esc(b.id)}" type="button">Отменить запись</button></div></article>`).join("") : '<p class="empty">Записей на этот день нет.</p>'}</section>`;
    }).join("");
    $("#stamp").textContent = "Обновлено в " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) + ", список обновляется сам раз в 10 секунд";
  } catch (e) {
    if (e.status === 401) { logout(); $("#gateErr").textContent = "Ключ не подошёл. Проверьте его и попробуйте ещё раз."; $("#gateErr").hidden = false; return; }
    log.error("refresh_failed", e, { date });
    $("#stamp").textContent = "Нет связи, пробуем снова";
  }
  timer = setTimeout(refresh, 10000);
}
function start() { $("#gate").hidden = true; $("#app").hidden = false; if (!$("#date").value) $("#date").value = new Date(Date.now() + 4 * 3600000).toISOString().slice(0, 10); refresh(); }
function logout() { clearTimeout(timer); key = ""; try { sessionStorage.removeItem("lepestok.key"); } catch {} $("#app").hidden = true; $("#gate").hidden = false; }
$("#gate").addEventListener("submit", (e) => { e.preventDefault(); key = $("#key").value.trim(); try { sessionStorage.setItem("lepestok.key", key); } catch {} $("#gateErr").hidden = true; start(); });
$("#out").addEventListener("click", logout);
$("#date").addEventListener("change", refresh);
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-cancel]"); if (!b) return;
  b.disabled = true;
  try { await call("/admin/nails/cancel", { id: b.dataset.cancel }); refresh(); }
  catch (err) { log.error("cancel_failed", err, { id: b.dataset.cancel }); b.disabled = false; }
});
if (key) start();
</script>
</body>
</html>
